<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#090611;color:white}
.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 62% 40% at 50% 37%,#4a2c68 0%,#231533 48%,#090611 100%)}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,transparent 28%,rgba(0,0,0,.55) 100%);z-index:6;pointer-events:none}
.stars{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
.mountains{position:absolute;left:0;bottom:0;width:100%;height:82%;z-index:2;overflow:visible}
.mountain-back{fill:#46345c}.mountain-mid{fill:#6a5084}.mountain-front{fill:#a58ab9}
.mountain-back,.mountain-mid,.mountain-front{transition:fill .4s}
.mountains{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(9%);opacity:.3}to{transform:translateY(0);opacity:1}}
.center{position:absolute;inset:0;z-index:7;display:flex;align-items:center;flex-direction:column;pointer-events:none}
.logo{font-size:clamp(40px,6.4vw,94px);font-weight:300;line-height:.94;letter-spacing:-.075em;text-align:center;margin-top:clamp(22px,4.8vh,55px);text-shadow:0 3px 18px #10081e8a;user-select:none}
.logo .second{display:block;font-size:.89em;letter-spacing:.015em;margin-top:5px}
.logo .first{display:block}.logo .spark{display:inline-block;font-size:.35em;vertical-align:top;margin-left:.12em;transform:rotate(20deg)}
.play{pointer-events:auto;border:0;border-radius:50%;width:clamp(94px,10vw,136px);height:clamp(94px,10vw,136px);margin-top:clamp(35px,6vh,65px);background:#0b0710;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 35px #180d2877;transition:transform .2s,box-shadow .2s}
.play:hover{transform:scale(1.08);box-shadow:0 10px 50px #c084fc80}.play:focus-visible,.corner:focus-visible{outline:3px solid #e9c9ff;outline-offset:5px}
.play svg{width:39%;height:39%;margin-left:7%;fill:#fff}
.corner{position:absolute;z-index:8;bottom:17px;width:48px;height:48px;display:grid;place-items:center;border:0;background:#0b0710;color:#fff;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 3px 15px #120b1c55}.corner.left{left:22px}.corner.right{right:22px}
.modal-shade{position:fixed;inset:0;z-index:20;background:#050309b9;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px)}.modal-shade.open{display:flex}
.modal{position:relative;width:min(420px,100%);padding:32px;border-radius:20px;background:#21132e;border:1px solid #76538d;color:#fff;box-shadow:0 25px 100px #0009}.modal h2{margin:0 0 12px;font-weight:500}.modal p{line-height:1.6;color:#e4d6ed}.modal button{background:#a26bc9;color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}.modal .close{position:absolute;right:12px;top:10px;background:transparent;font-size:24px;padding:5px 12px}

@media(max-width:600px){.logo{margin-top:8vh;font-size:clamp(34px,9.2vw,58px)}.play{margin-top:8vh}.mountains{height:78%}}
@media(prefers-reduced-motion:reduce){.mountains{animation:none}.play{transition:none}}

/* Gentle motion upgrade: preserve the original layout and palette */
.scene{background-size:115% 115%;animation:skyBreath 18s ease-in-out infinite alternate}
@keyframes skyBreath{0%{background-position:48% 44%}100%{background-position:55% 52%}}
.mountain-back{animation:mountainDriftBack 16s ease-in-out infinite alternate;transform-origin:center bottom}
.mountain-mid{animation:mountainDriftMid 12s ease-in-out infinite alternate;transform-origin:center bottom}
.mountain-front{animation:mountainDriftFront 9s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes mountainDriftBack{from{transform:translateX(-8px) translateY(0)}to{transform:translateX(9px) translateY(5px)}}
@keyframes mountainDriftMid{from{transform:translateX(7px) translateY(3px)}to{transform:translateX(-8px) translateY(-3px)}}
@keyframes mountainDriftFront{from{transform:translateX(-4px)}to{transform:translateX(5px) translateY(3px)}}
.logo{animation:logoAppear .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoAppear{from{opacity:0;transform:translateY(-16px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.logo .spark{animation:sparkTwinkle 4s ease-in-out infinite}
@keyframes sparkTwinkle{0%,100%{opacity:.65;transform:rotate(20deg) scale(.9)}50%{opacity:1;transform:rotate(65deg) scale(1.2)}}
.play{position:relative;isolation:isolate;animation:playFloat 3.8s ease-in-out infinite;transition:scale .28s cubic-bezier(.2,.9,.2,1),background .28s,box-shadow .28s}
.play:before{content:"";position:absolute;inset:-11px;border:2px solid rgba(207,151,255,.38);border-radius:50%;opacity:.7;animation:playRing 3.8s ease-in-out infinite;pointer-events:none}
.play:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(193,128,245,.25),transparent 60%);pointer-events:none}
.play svg{position:relative;z-index:1;transition:transform .25s ease}
.play:hover{scale:1.1;transform:none;background:#1d1027;box-shadow:0 10px 50px #c084fc80}
.play:hover svg{transform:translateX(3px) scale(1.09)}
.play:active{scale:.94}
@keyframes playFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes playRing{0%,100%{transform:scale(.96);opacity:.35}50%{transform:scale(1.055);opacity:.8}}
.corner{transition:transform .28s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s;animation:cornerAppear .8s ease-out both}
.corner.right{animation-delay:.12s}
.corner:hover{transform:translateY(-5px) rotate(8deg) scale(1.1);background:#2b173a;box-shadow:0 8px 28px #c084fc77}
.corner:active{transform:scale(.92)}
@keyframes cornerAppear{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
.modal{animation:modalPop .25s cubic-bezier(.2,.85,.2,1) both}
@keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.scene.motion-off,.scene.motion-off .mountains,.scene.motion-off .mountains path,.scene.motion-off .logo,.scene.motion-off .spark,.scene.motion-off .play,.scene.motion-off .play:before,.scene.motion-off .corner{animation:none!important;transition:none!important}
.scene.no-parallax .mountains path{animation:none!important}.scene.no-glow:before{opacity:0}@media(prefers-reduced-motion:reduce){.scene,.mountains,.mountains path,.logo,.logo .spark,.play,.play:before,.corner,.modal{animation:none!important;transition:none!important}}


/* Settings panel — same purple silhouette aesthetic */
.modal.settings-modal{width:min(680px,96vw);max-height:min(86vh,760px);overflow:auto;padding:0;background:linear-gradient(160deg,#281734,#170e23);border:1px solid #9d79b4;scrollbar-color:#80569a #24152f}

.settings-row input[type=checkbox]:checked{background:#a46bc6}.settings-row input[type=checkbox]:checked:before{transform:translateX(18px)}
.settings-value{font-size:12px;color:#e1c1f2;min-width:40px;text-align:right}
.settings-control{display:flex;align-items:center;gap:8px}
.settings-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 30px 25px}
.settings-foot button{border:1px solid #9b6db7;background:#6f448b;border-radius:12px;padding:12px 20px;transition:filter .2s}.settings-foot button:hover{filter:brightness(1.2)}
.music-hint{font-size:12px;color:#c9b1d8;margin:0 30px 10px;line-height:1.5}
.fps-display{position:fixed;right:15px;top:12px;z-index:9;font:13px monospace;color:#e7c8ff;background:#160b25a8;padding:6px 9px;border-radius:8px;pointer-events:none}
@media(max-width:540px){.settings-head{padding:22px 18px 15px}.settings-content{padding:5px 18px 16px}.settings-tabs{padding:10px}.settings-foot{padding:14px 18px 20px}.settings-row{gap:9px}.settings-row strong{font-size:13px}.settings-row small{font-size:11px}.settings-row input[type=range]{width:100px}.settings-row select{max-width:120px}}

/* Refined settings overlay — matches the original purple mountain menu */
.modal-shade{background:rgba(8,3,16,.77);backdrop-filter:blur(14px) saturate(1.2)}
.modal.settings-modal{width:min(780px,calc(100vw - 32px));max-height:min(84vh,780px);overflow:hidden;display:flex;flex-direction:column;border:1px solid #b58bc37a;border-radius:27px;background:linear-gradient(160deg,#2b193b 0%,#1b1028 55%,#140b1f 100%);box-shadow:0 30px 100px #06030a99,0 0 55px #7f48a526;padding:0}
.settings-modal #modal-body{display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1}
.settings-modal .close{z-index:4;top:19px;right:20px;border-radius:50%;width:38px;height:38px;padding:0;background:#ffffff12;color:#e8d9ef;transition:background .2s,transform .2s}
.settings-modal .close:hover{background:#ffffff29;transform:rotate(90deg)}
.settings-head{position:relative;flex-shrink:0;padding:30px 35px 20px;background:transparent;border-bottom:0}
.settings-head:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,#8f5caa30,transparent 70%)}
.settings-head h2{position:relative;font-size:clamp(26px,3vw,35px);letter-spacing:.08em;font-weight:300;margin:0 0 8px}
.settings-head p{position:relative;font-size:13px;color:#d5c2e0}
.settings-tabs{display:flex;flex-shrink:0;gap:8px;padding:8px 30px 16px;border-bottom:1px solid #ffffff18}
.settings-tab{flex:1;min-width:0;border:1px solid #ffffff12!important;border-radius:13px!important;background:#ffffff08!important;padding:12px 6px!important;color:#c9b2d7!important;font-size:13px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s!important}
.settings-tab:hover{transform:translateY(-2px);background:#a56ac52a!important}
.settings-tab[aria-selected=true]{color:#fff!important;background:linear-gradient(130deg,#8b58ab77,#5e367d88)!important;border-color:#c394dd7a!important;box-shadow:inset 0 1px #ffffff1c,0 4px 18px #b773d01a}
.settings-content{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#9564aa transparent;padding:9px 35px 16px}
.settings-section-title{font-size:11px;letter-spacing:.2em;color:#d5a7ec;margin:18px 0 9px;font-weight:700}
.settings-row{padding:16px 2px;border-bottom:1px solid #ffffff13;transition:background .2s}
.settings-row:hover{background:#ffffff06}
.settings-row strong{font-size:14px;font-weight:600}.settings-row small{font-size:12px;color:#c4accf}
.settings-row select{border-radius:11px;background:#120b1d;border:1px solid #a47bb0;color:#f7ebff;padding:10px 12px;min-width:120px;cursor:pointer}
.settings-row input[type=range]{accent-color:#bf85db}
.settings-row input[type=checkbox]{background:#544060;width:47px;height:27px}
.settings-row input[type=checkbox]:before{width:19px;height:19px}
.settings-row input[type=checkbox]:checked{background:#a96bc7}
.settings-row input[type=checkbox]:checked:before{transform:translateX(20px)}
.settings-foot{flex-shrink:0;padding:17px 35px 23px;border-top:1px solid #ffffff15;background:#1a1026;display:flex;justify-content:space-between}
.settings-foot button{padding:11px 20px;background:#6f438b;border:1px solid #aa7ac3;border-radius:12px;cursor:pointer;transition:transform .2s,background .2s}

.settings-foot button#reset-settings{background:#ffffff0b;border-color:#ffffff26}
.settings-foot button#reset-settings:hover{background:#ffffff20}
.settings-modal .music-hint{margin:13px 0 5px;padding:12px 14px;border-radius:12px;background:#9c6bc51a;color:#d8c3e4}
@media(max-width:560px){.modal.settings-modal{max-height:90vh;border-radius:20px}.settings-head{padding:25px 20px 15px}.settings-tabs{padding:6px 14px 12px;gap:5px}.settings-tab{font-size:11px;padding:10px 3px!important}.settings-content{padding:8px 20px 12px}.settings-foot{padding:12px 20px 18px}.settings-row{gap:8px}.settings-row select{min-width:90px}}
.settings-tabs{display:none!important}.settings-divider{margin-top:27px!important;padding-top:22px;border-top:1px solid #a17bb34a}.settings-content{padding-top:15px!important}.settings-modal .settings-head{padding-bottom:18px!important}.corner.right{font-size:29px;line-height:1;color:#fff}.corner.right:hover{color:#e7baff;transform:translateY(-5px) rotate(-12deg) scale(1.14)}
</style>

<body>
<main class="scene">
<canvas class="stars" id="stars" aria-hidden="true"></canvas>
<svg class="mountains" viewBox="0 0 1440 800" preserveAspectRatio="none" aria-hidden="true">

<div class="center"><h1 class="logo"><span class="first">ROLLING SKY<span class="spark">✦</span></span><span class="second">CREATE</span></h1><button class="play" id="play" aria-label="Play"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 3Q7 0 11 3L36 18Q40 20 36 23L11 38Q7 40 7 35Z"/></svg></button></div>

</main>
<div class="fps-display" id="fps-display" hidden>-- FPS</div><div class="modal-shade" id="shade" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" id="close" aria-label="Close">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></section></div>
<script>
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[],animation=!matchMedia('(prefers-reduced-motion: reduce)').matches,frame=0,raf=0;document.querySelector('.scene').classList.toggle('motion-off',!animation);
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:105},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.48,r:Math.random()*1.7+.5,p:Math.random()*6.28,speed:.04+Math.random()*.14}));if(!animation)draw()}
function draw(now=performance.now()){if(animation){raf=requestAnimationFrame(draw);const interval=1000/Math.max(1,Number(settings?.fps||60));if(now-lastFrame<interval-1)return;const delta=lastFrame?now-lastFrame:interval;lastFrame=now;fpsSamples.push(1000/delta);if(fpsSamples.length>25)fpsSamples.shift();if(++fpsTicks%15===0)fpsEl.textContent=Math.round(fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length)+' FPS'}ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){const a=animation?.5+.5*Math.sin(frame*.018+s.p):.85;if(animation){s.y-=s.speed;if(s.y<0){s.y=innerHeight*.48;s.x=Math.random()*innerWidth}}ctx.fillStyle='rgba(255,240,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();if(s.r>1.5){ctx.globalAlpha=a*.5;ctx.fillRect(s.x-3,s.y-.35,6,.7);ctx.fillRect(s.x-.35,s.y-3,.7,6);ctx.globalAlpha=1}}if(animation){frame++}}
addEventListener('resize',resize);
const shade=document.getElementById('shade'),title=document.getElementById('modal-title'),body=document.getElementById('modal-body');
function openModal(t,html){title.textContent=t;body.innerHTML=html;shade.classList.add('open');document.getElementById('close').focus()}
function closeModal(){shade.classList.remove('open')}
document.getElementById('close').onclick=closeModal;shade.addEventListener('click',e=>{if(e.target===shade)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('play').onclick=()=>openModal('Play','<p>The playable 3D levels are coming in a future update. This is the new main-menu preview.</p><button onclick="closeModal()">Back to menu</button>');
document.getElementById('editor').onclick=()=>openModal('Featured Levels','<p>Featured levels are coming soon. Discover hand-picked community levels here.</p><button onclick="closeModal()">Back to menu</button>');

const defaults={master:75,music:70,musicOn:true,quality:'high',fps:60,showFps:false,motion:true};
let settings={...defaults};try{const stored=JSON.parse(localStorage.getItem('rsc-settings')||'{}');for(const k of Object.keys(defaults)){if(typeof stored[k]===typeof defaults[k])settings[k]=stored[k]}}catch{}
const scene=document.querySelector('.scene'),fpsEl=document.getElementById('fps-display');
let lastFrame=0,fpsSamples=[],fpsTicks=0,audioContext=null,masterGain=null,sfxGain=null,activeMusic=false;
const menuMusic=new Audio();menuMusic.loop=true;menuMusic.preload='auto';
const musicCandidates=['./assets/Nirvana.mp3','./assets/nirvana.mp3','./assets/12.%20Nirvana.mp3','./assets/menu-music.mp3'];let musicCandidateIndex=0;menuMusic.src=musicCandidates[0];
let soundtrackAvailable=true;
menuMusic.addEventListener('error',()=>{if(++musicCandidateIndex<musicCandidates.length){menuMusic.src=musicCandidates[musicCandidateIndex];menuMusic.load();if(activeMusic)menuMusic.play().catch(()=>{});}else{soundtrackAvailable=false;updateMusicStatus()}});
menuMusic.addEventListener('canplay',()=>{soundtrackAvailable=true;updateMusicStatus();if(activeMusic&&settings.musicOn&&menuMusic.paused)menuMusic.play().catch(()=>{})});
function updateMusicStatus(){const el=document.querySelector('#music-status');if(el)el.textContent=soundtrackAvailable?'Nirvana · click once to start playback.':'Nirvana not found on the published branch. Check the file name and GitHub Pages deployment.'}
function save(){try{localStorage.setItem('rsc-settings',JSON.stringify(settings))}catch{}}
function volume(){if(audioContext){masterGain.gain.setTargetAtTime(settings.master/100,audioContext.currentTime,.035)}menuMusic.volume=Math.max(0,Math.min(1,(settings.master/100)*(settings.music/100)));if(!settings.musicOn)menuMusic.pause();else if(activeMusic&&soundtrackAvailable&&menuMusic.paused)menuMusic.play().catch(()=>{})}
function startAudio(){activeMusic=true;try{if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioContext.createGain();sfxGain=audioContext.createGain();sfxGain.connect(masterGain);masterGain.connect(audioContext.destination)}audioContext.resume()}catch(e){console.warn('Audio unavailable',e)}volume()}
function playTone(freq,when,duration,gain,type='sine',target=sfxGain){if(!audioContext||!target)return;const osc=audioContext.createOscillator(),env=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,when);env.gain.setValueAtTime(.0001,when);env.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),when+.025);env.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(env);env.connect(target);osc.start(when);osc.stop(when+duration+.03)}
function uiSound(){if(!audioContext||audioContext.state!=='running')return;playTone(660,audioContext.currentTime,.09,.04,'sine',sfxGain)}
function setMotion(v){animation=v&&!matchMedia('(prefers-reduced-motion: reduce)').matches;scene.classList.toggle('motion-off',!animation);cancelAnimationFrame(raf);lastFrame=0;if(animation)raf=requestAnimationFrame(draw);else draw()}
function applySettings(){setMotion(settings.motion);fpsEl.hidden=!settings.showFps;const d=Math.min(devicePixelRatio||1,settings.quality==='low'?1:settings.quality==='medium'?1.5:2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);const target=settings.quality==='low'?55:105;while(stars.length<target)stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.48,r:Math.random()*1.7+.5,p:Math.random()*6.28,speed:.04+Math.random()*.14});stars.length=target;volume()}
const row=(key,label,desc,control)=>'<label class="settings-row"><span><strong>'+label+'</strong><small>'+desc+'</small></span><span class="settings-control">'+control+'</span></label>';
const range=(key,min,max,unit='%')=>'<input aria-label="'+key+'" data-setting="'+key+'" type="range" min="'+min+'" max="'+max+'" step="1" value="'+settings[key]+'"><output class="settings-value" data-value="'+key+'">'+settings[key]+unit+'</output>';
const toggle=key=>'<input aria-label="'+key+'" data-setting="'+key+'" type="checkbox" '+(settings[key]?'checked':'')+'>';
const select=(key,values)=>'<select aria-label="'+key+'" data-setting="'+key+'">'+values.map(([v,l])=>'<option value="'+v+'" '+(String(settings[key])===String(v)?'selected':'')+'>'+l+'</option>').join('')+'</select>';
function tabContents(){return '<div class="settings-section-title">AUDIO</div>'+
row('music','Music volume','Volume of the Nirvana menu soundtrack',range('music',0,100))+
row('master','Master volume','Overall game audio level',range('master',0,100))+
row('musicOn','Menu music','Play Nirvana in the background',toggle('musicOn'))+
'<p class="music-hint" id="music-status"></p>'+
'<div class="settings-section-title settings-divider">GRAPHICS</div>'+
row('quality','Graphics quality','Game rendering preset (menu preview supported)',select('quality',[['low','Low'],['medium','Medium'],['high','High']]))+
row('motion','Animations','Enable game and menu animations',toggle('motion'))+
'<div class="settings-section-title settings-divider">PERFORMANCE</div>'+
row('fps','FPS limit','Target FPS for gameplay (currently applies to menu)',select('fps',[[30,'30 FPS'],[60,'60 FPS'],[120,'120 FPS'],[144,'144 FPS'],[240,'240 FPS']]))+
row('showFps','Show FPS counter','Display live FPS while playing',toggle('showFps'))}
function renderSettings(){const modal=document.querySelector('.modal');modal.classList.add('settings-modal');title.textContent='';body.innerHTML='<div class="settings-head"><h2>SETTINGS</h2><p>Rolling Sky Create</p></div><div class="settings-content">'+tabContents()+'</div><div class="settings-foot"><button id="reset-settings">Reset defaults</button><button id="done-settings">Done ✓</button></div>';
updateMusicStatus();
body.querySelectorAll('[data-setting]').forEach(el=>{const key=el.dataset.setting;const change=()=>{settings[key]=el.type==='checkbox'?el.checked:el.type==='range'||key==='fps'?Number(el.value):el.value;const output=body.querySelector('[data-value="'+key+'"]');if(output)output.textContent=settings[key]+'%';save();applySettings();if(key==='musicOn'&&settings.musicOn)startAudio()};el.addEventListener(el.type==='range'?'input':'change',change)});
body.querySelector('#reset-settings').onclick=()=>{settings={...defaults};save();applySettings();renderSettings();uiSound()};
body.querySelector('#done-settings').onclick=()=>{uiSound();closeModal()}}
const originalClose=closeModal;closeModal=function(){document.querySelector('.modal').classList.remove('settings-modal');originalClose()};
document.getElementById('settings').onclick=()=>{startAudio();uiSound();openModal('Settings','');renderSettings()};
document.getElementById('play').addEventListener('click',()=>{startAudio();uiSound()});
document.getElementById('editor').addEventListener('click',()=>{startAudio();uiSound()});
document.addEventListener('pointerdown',()=>{if(!activeMusic)startAudio()},{once:true});
applySettings();

</script>
</body></html>
