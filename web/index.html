<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b1e"><title>Rolling Sky Create</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#fff;background:#070b1c}*{box-sizing:border-box}body{margin:0;overflow:hidden}#world{position:fixed;inset:0;z-index:0}#world canvas{display:block}#vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,7,22,.86),rgba(6,9,26,.3) 75%),linear-gradient(0deg,rgba(5,7,22,.8),transparent 50%);z-index:1}.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center;padding:30px clamp(24px,5vw,84px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.18em;font-size:12px}.orb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#65c8ff 35%,#7767ff 70%);box-shadow:0 0 28px #5b8cff}header .right{display:flex;gap:12px;align-items:center}.pill{padding:10px 16px;border:1px solid #ffffff33;border-radius:50px;background:#ffffff12;font-size:12px;letter-spacing:.12em}main{flex:1;display:flex;align-items:center;padding:20px clamp(24px,9vw,155px)}.hero{max-width:660px;animation:rise .9s both}.eyebrow{color:#87e5ff;letter-spacing:.35em;font-weight:800;font-size:12px;text-transform:uppercase}.logo{margin:15px 0 10px;font-size:clamp(58px,9vw,132px);line-height:.82;font-weight:1000;letter-spacing:-.075em;text-transform:uppercase;text-shadow:0 12px 40px #0008}.logo span{display:block;background:linear-gradient(135deg,#fff 15%,#8deaff 45%,#9e89ff 80%);-webkit-background-clip:text;background-clip:text;color:transparent}.logo .small{font-size:.59em;letter-spacing:.03em;margin-top:12px;color:#fff;background:none;-webkit-text-fill-color:#fff}.desc{color:#c2cee5;font-size:clamp(14px,1.4vw,18px);line-height:1.7;max-width:450px;margin:28px 0}.actions{display:flex;flex-wrap:wrap;gap:12px;pointer-events:auto}button{font:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}button:hover{transform:translateY(-3px)}button:focus-visible{outline:3px solid #8deaff;outline-offset:4px}.primary{background:linear-gradient(120deg,#46d4ff,#7c68ff);color:#06101f;border:0;border-radius:15px;padding:18px 28px;font-weight:900;box-shadow:0 10px 40px #457cff65}.secondary{background:#ffffff16;border:1px solid #ffffff48;color:white;border-radius:15px;padding:18px 25px;font-weight:800;backdrop-filter:blur(10px)}.features{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;color:#b6c4e3;font-size:12px}.features span{border:1px solid #ffffff24;background:#080c22a0;border-radius:50px;padding:9px 14px}footer{padding:25px clamp(24px,5vw,84px);display:flex;justify-content:space-between;color:#a4afcb;font-size:11px;letter-spacing:.15em}.panel-wrap{position:fixed;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:#020412c9;backdrop-filter:blur(16px);padding:20px}.panel-wrap.open{display:flex}.panel{width:min(530px,100%);border:1px solid #ffffff35;border-radius:24px;background:linear-gradient(150deg,#1b2547,#0a1027);box-shadow:0 25px 120px #000a;padding:30px;animation:rise .25s both}.panel h2{font-size:28px;margin:0 0 10px}.panel p{color:#b9c7e4;line-height:1.65}.panel-top{display:flex;align-items:center;justify-content:space-between}.close{background:#ffffff16;border:1px solid #ffffff30;border-radius:10px;color:white;padding:9px 14px}.setting{display:flex;align-items:center;justify-content:space-between;margin:20px 0;gap:15px}.setting input{accent-color:#76cfff}.hint{font-size:12px;color:#8fa2c9}.toast{position:fixed;z-index:8;bottom:80px;left:50%;transform:translateX(-50%);background:#172348;border:1px solid #ffffff55;padding:14px 20px;border-radius:14px;display:none;max-width:90vw;text-align:center}.toast.show{display:block}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){header{padding:20px}main{padding:24px;align-items:center}.logo{font-size:clamp(54px,15vw,92px)}footer{padding:18px 24px}.pill{display:none}.desc{max-width:330px}.secondary,.primary{padding:15px 19px}}
</style></head><body><div id="world" aria-hidden="true"></div><div id="vignette"></div><div class="app"><header><div class="brand"><span class="orb"></span> RSC <span style="opacity:.4">/</span> CREATE</div><div class="right"><span class="pill">WEB ENGINE · ALPHA 0.1</span><button class="close" id="settingsTop" aria-label="Open settings">⚙ SETTINGS</button></div></header><main><div class="hero"><div class="eyebrow">Your world. Your rhythm.</div><h1 class="logo"><span>ROLLING</span><span>SKY</span><span class="small">CREATE</span></h1><p class="desc">Build impossible worlds. Ride the rhythm. Create your own sky-high adventure.</p><div class="actions"><button class="primary" id="play">▶ &nbsp; PLAY</button><button class="secondary" id="editor">✦ &nbsp; LEVEL EDITOR</button><button class="secondary" id="settings">⚙ &nbsp; SETTINGS</button></div><div class="features"><span>✧ LIVE 3D WORLD</span><span>◈ CUSTOM LEVELS</span><span>✦ CREATE & EXPLORE</span></div></div></main><footer><span>© ROLLING SKY CREATE</span><span>BUILD 0.1 · MENU PROTOTYPE</span></footer></div>
<div class="panel-wrap" id="modal" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><section class="panel"><div class="panel-top"><h2 id="panelTitle">Settings</h2><button class="close" id="close">✕ CLOSE</button></div><div id="panelBody"></div></section></div><div class="toast" id="toast" role="status"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const host=document.querySelector('#world');const scene=new THREE.Scene();scene.background=new THREE.Color('#080d29');scene.fog=new THREE.FogExp2('#0c1332',.025);const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,250);camera.position.set(9,8,19);camera.lookAt(0,1,-13);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8ccaff,0x171331,2.4));const light=new THREE.DirectionalLight(0xb2e7ff,3);light.position.set(-7,14,9);scene.add(light);const accent=new THREE.PointLight(0x8665ff,65,40);accent.position.set(5,5,-8);scene.add(accent);
const mat=(c,metalness=.1,roughness=.35)=>new THREE.MeshStandardMaterial({color:c,metalness,roughness});const tileMats=[mat('#192f63',.3),mat('#274a89',.3),mat('#355ca0',.3)];const glow=new THREE.MeshStandardMaterial({color:'#6e9cff',emissive:'#2a57ff',emissiveIntensity:1.4,metalness:.5,roughness:.18});const cyan=new THREE.MeshStandardMaterial({color:'#79ecff',emissive:'#23b9ff',emissiveIntensity:1.8,metalness:.2});const purple=new THREE.MeshStandardMaterial({color:'#a385ff',emissive:'#613bff',emissiveIntensity:1.4});const ground=new THREE.Group();scene.add(ground);const tiles=[];for(let z=0;z<34;z++){for(let x=-3;x<=3;x++){const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.95,.36,1.95),tileMats[(z+x+30)%3]);mesh.position.set(x*2,-.5,-z*2);ground.add(mesh);tiles.push(mesh);if(x===-3||x===3){const edge=new THREE.Mesh(new THREE.BoxGeometry(.065,.08,1.95),glow);edge.position.set(x*2+(x>0?1:-1),-.26,-z*2);ground.add(edge)}}}
const obstacles=new THREE.Group();scene.add(obstacles);for(let i=0;i<20;i++){const z=-i*4.6-5;const x=([-2,0,2,1,-1])[i%5]*2;const height=1.5+(i%4)*.65;const mesh=new THREE.Mesh(i%3===0?new THREE.ConeGeometry(.9,height,4):new THREE.BoxGeometry(1.35,height,1.35),i%2?purple:cyan);mesh.position.set(x,height/2-.3,z);mesh.rotation.y=Math.PI/4;obstacles.add(mesh)}const ballGroup=new THREE.Group();scene.add(ballGroup);ballGroup.position.set(1.7,2,4);const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(2,5),new THREE.MeshPhysicalMaterial({color:0x79dcff,metalness:.35,roughness:.14,clearcoat:1,clearcoatRoughness:.08,emissive:0x173a8b,emissiveIntensity:.65}));ballGroup.add(ball);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.65,.055,10,110),cyan);ring.rotation.x=Math.PI/2.6;ballGroup.add(ring);const ring2=new THREE.Mesh(new THREE.TorusGeometry(3.05,.045,10,110),purple);ring2.rotation.y=Math.PI/3;ballGroup.add(ring2);const starGeo=new THREE.BufferGeometry();const positions=new Float32Array(700*3);for(let i=0;i<700;i++){positions[i*3]=(Math.random()-.5)*130;positions[i*3+1]=Math.random()*70-8;positions[i*3+2]=(Math.random()-.5)*140-40}starGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc9e9ff,size:.12,transparent:true,opacity:.85}));scene.add(stars);let motion=true,quality=true,elapsed=0,last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(motion)elapsed+=dt;const t=elapsed;ball.rotation.y=t*.42;ball.rotation.z=t*.23;ballGroup.position.y=2+Math.sin(t*1.7)*.28;ring.rotation.z=t*.25;ring2.rotation.x=t*.32;camera.position.x=9+Math.sin(t*.19)*.8;camera.lookAt(0,1,-13);stars.rotation.y=t*.002;for(const mesh of tiles){mesh.position.z+=dt*2.8;if(mesh.position.z>5)mesh.position.z-=68}for(const mesh of obstacles.children){mesh.position.z+=dt*2.8;if(mesh.position.z>8)mesh.position.z-=92;mesh.rotation.y+=dt*.24}renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const modal=document.querySelector('#modal'),body=document.querySelector('#panelBody'),title=document.querySelector('#panelTitle'),toast=document.querySelector('#toast');let previousFocus;function open(name){previousFocus=document.activeElement;title.textContent=name;modal.classList.add('open');if(name==='Settings'){body.innerHTML='<p>Customize the animated menu preview.</p><label class="setting">Animated background <input id="motion" type="checkbox" '+(motion?'checked':'')+'></label><label class="setting">High resolution <input id="quality" type="checkbox" '+(quality?'checked':'')+'></label><p class="hint">Your changes apply immediately to this session.</p>';document.querySelector('#motion').onchange=e=>motion=e.target.checked;document.querySelector('#quality').onchange=e=>{quality=e.target.checked;renderer.setPixelRatio(quality?Math.min(devicePixelRatio,2):1);renderer.setSize(innerWidth,innerHeight)}}else{body.innerHTML='<p>This is the first playable foundation of the new web engine. The '+(name==='Play'?'gameplay':'level editor')+' screen is next to be implemented.</p><p class="hint">The menu is functional; gameplay and editing are not included in this first commit.</p>'}document.querySelector('#close').focus()}function close(){modal.classList.remove('open');previousFocus?.focus()}document.querySelector('#play').onclick=()=>open('Play');document.querySelector('#editor').onclick=()=>open('Level Editor');document.querySelector('#settings').onclick=()=>open('Settings');document.querySelector('#settingsTop').onclick=()=>open('Settings');document.querySelector('#close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close();if(e.key==='Tab'&&modal.classList.contains('open')){const focusables=[...modal.querySelectorAll('button,input')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
</script></body></html>
